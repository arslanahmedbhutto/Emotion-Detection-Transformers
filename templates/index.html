<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Emotion Detection</title>
        <style>
            body {
                font-family: 'Arial', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                color: #ffffff;
            }
            .container {
                text-align: center;
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                padding: 40px;
                border-radius: 10px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                width: 400px;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
            h1 {
                font-size: 24px;
                color: #ffffff;
                text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            }
            form {
                margin-top: 20px;
            }
            input[type="text"], select {
                width: 100%;
                padding: 10px;
                margin-top: 8px;
                margin-bottom: 16px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 4px;
                background: rgba(255, 255, 255, 0.2);
                color: #000; /* Changed text color to black */
                box-sizing: border-box;
                transition: all 0.3s ease;
            }
            input[type="text"]:hover, select:hover {
                background: rgba(255, 255, 255, 0.3);
            }
            button {
                width: 100%;
                background-color: #4CAF50;
                color: white;
                padding: 14px 20px;
                margin: 8px 0;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }
            button:hover {
                background-color: #45a049;
            }
            .loading {
                text-align: center;
                visibility: hidden;
            }
        </style>
        <script>
            function displayLoading() {
                const button = document.querySelector('button');
                const loadingText = document.getElementById('loadingText');
                button.disabled = true;
                loadingText.style.visibility = 'visible';
                setTimeout(() => {
                    button.disabled = false;
                    loadingText.style.visibility = 'hidden';
                }, 2000); // Loading effect for 2 seconds
            }
        </script>
    </head>

<body>
    <div class="container">
        <h1>Analyzing Emotional Dynamics</h1>
        <form method="POST" onsubmit="displayLoading()">
            <label for="text">Enter your text:</label>
            <input type="text" id="text" name="text" required>
            
            <label for="model_type">Choose a model:</label>
            <select name="model_type" id="model_type">
                <option value="distilbert">DistilBert</option>
                <option value="xlnet">XLNet</option>
                <option value="bigbird">BigBird</option>
                <option value="roberta">RoBERTa</option>
            </select>
            
            <button type="submit">Analyze Emotion</button>
        </form>
        <div id="loadingText" class="loading">Loading...</div>
        {% if predicted_class %}
            <div class="results">
                <h2>Result:</h2>
                <p>Predicted Emotion: <strong>{{ predicted_class }}</strong></p>
                <p>Confidence Levels: <strong>{{ confidence }}</strong></p>
                <p>Input Text: <strong>{{ text }}</strong></p>
                <p>Model Used: <strong>{{ model_type }}</strong></p>
            </div>
        {% endif %}
    </div>
</body>
</html>
